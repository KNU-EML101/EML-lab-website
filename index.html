<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Advanced Energy Materials Laboratory"><link rel="stylesheet" href="styles.css"><script src="js/content-common.js"></script><title>AEM Lab</title><script src="js/content-home.js"></script><script src="js/app.js"></script></head><body><header id="siteHeader"></header><main><section class="hero"><div class="container hero-grid"><div><div class="eyebrow" id="labNameHero"></div><h1 id="heroTitle"></h1><p id="heroDescription"></p><div class="hero-actions"><a class="btn btn-primary" href="research.html">Explore Research</a><a class="btn btn-secondary" href="contact.html">Join Our Lab</a></div></div><div class="hero-card"><div class="orb o1"></div><div class="orb o2"></div><div class="network"></div><div class="hero-card-content"><div class="eyebrow" style="color:#9dc9f3">Focus Area</div><h3 id="focusTitle"></h3><p id="focusDescription"></p></div></div></div></section><section class="about"><div class="container"><div class="section-head"><h2>About the Lab</h2><p id="aboutDescription"></p></div><div class="about-grid"><div class="portrait" id="professorPhoto">PROFESSOR PHOTO</div><div><div class="eyebrow">Principal Investigator</div><p class="quote" id="professorQuote"></p><h3 style="font-size:25px;margin:0 0 8px" id="professorName"></h3><p class="muted" id="professorAffiliation"></p><div class="stats" id="statsGrid"></div></div></div></div></section></main><footer id="siteFooter"></footer><script>document.addEventListener('DOMContentLoaded',()=>{renderShell('home');const c=COMMON_CONTENT,d=PAGE_CONTENT;document.getElementById('labNameHero').textContent=c.labName;document.getElementById('heroTitle').innerHTML=d.heroTitle;document.getElementById('heroDescription').textContent=d.heroDescription;document.getElementById('focusTitle').innerHTML=d.focusTitle;document.getElementById('focusDescription').textContent=d.focusDescription;document.getElementById('aboutDescription').textContent=d.aboutDescription;const p=document.getElementById('professorPhoto');if(c.professor.photo)p.innerHTML=`<img src="${esc(c.professor.photo)}" alt="${esc(c.professor.name)}" style="width:100%;height:100%;object-fit:cover">`;document.getElementById('professorQuote').textContent=c.professor.quote;document.getElementById('professorName').textContent=c.professor.name;document.getElementById('professorAffiliation').textContent=c.professor.affiliation;document.getElementById('statsGrid').innerHTML=d.stats.map(x=>`<div class="stat"><strong>${esc(x.value)}</strong><span>${esc(x.label)}</span></div>`).join('');});</script></body></html>
