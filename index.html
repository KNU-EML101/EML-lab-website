<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="description" content="Advanced Energy Materials Laboratory">
  <link rel="stylesheet" href="styles.css?v=3">
  <script src="js/content-common.js"></script>
  <title>AEM Lab</title>
  <script src="js/content-home.js"></script>
  <script src="js/app.js?v=3"></script>
</head>
<body>
  <header id="siteHeader"></header>

  <main>
    <section class="hero hero-video">
      <!--
        [메인 배경 영상 교체 방법]
        1) 새 MP4 파일을 images 폴더에 넣습니다.
        2) 파일명을 battery-hero.mp4로 맞추면 HTML 수정 없이 바로 교체됩니다.
        3) 다른 파일명을 쓸 경우 아래 src 경로만 바꾸면 됩니다.
      -->
      <video class="hero-bg-video" autoplay muted loop playsinline preload="auto" poster="">
        <source src="images/battery-hero.mp4" type="video/mp4">
      </video>

      <div class="hero-video-overlay"></div>

      <div class="container hero-grid hero-grid-over-video">
        <div class="hero-copy">
          <div class="eyebrow hero-eyebrow" id="labNameHero"></div>
          <h1 id="heroTitle"></h1>
          <p id="heroDescription"></p>
          <div class="hero-actions">
            <a class="btn btn-primary" href="research.html">Explore Research</a>
            <a class="btn btn-glass" href="contact.html">Join Our Lab</a>
          </div>
        </div>

        <div class="hero-focus-panel">
          <div class="eyebrow" style="color:#9dc9f3">Focus Area</div>
          <h3 id="focusTitle"></h3>
          <p id="focusDescription"></p>
        </div>
      </div>
    </section>

    <section class="about">
      <div class="container">
        <div class="section-head">
          <h2>About the Lab</h2>
          <p id="aboutDescription"></p>
        </div>

        <div class="about-grid">
          <div class="portrait" id="professorPhoto">PROFESSOR PHOTO</div>
          <div>
            <div class="eyebrow">Principal Investigator</div>
            <p class="quote" id="professorQuote"></p>
            <h3 style="font-size:25px;margin:0 0 8px" id="professorName"></h3>
            <p class="muted" id="professorAffiliation"></p>
            <div class="pi-profile" id="professorProfile"></div>
            <div class="stats" id="statsGrid"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="recruitment-section">
      <div class="container">
        <div class="recruitment-card">
          <div class="eyebrow">Join Our Lab</div>
          <h2 id="recruitmentTitle"></h2>
          <p id="recruitmentDescription"></p>
          <a class="btn btn-primary" id="recruitmentContact" href="mailto:joojin@knu.ac.kr"></a>
        </div>
      </div>
    </section>
  </main>

  <footer id="siteFooter"></footer>

  <script>
    document.addEventListener('DOMContentLoaded',()=>{
      renderShell('home');
      const c = COMMON_CONTENT, d = PAGE_CONTENT;
      document.getElementById('labNameHero').textContent = c.labName;
      document.getElementById('heroTitle').innerHTML = d.heroTitle;
      document.getElementById('heroDescription').textContent = d.heroDescription;
      document.getElementById('focusTitle').innerHTML = d.focusTitle;
      document.getElementById('focusDescription').textContent = d.focusDescription;
      document.getElementById('aboutDescription').textContent = d.aboutDescription;

      const p = document.getElementById('professorPhoto');
      if(c.professor.photo){
        p.innerHTML = `<img src="${esc(c.professor.photo)}" alt="${esc(c.professor.name)}" style="width:100%;height:100%;object-fit:cover">`;
      }

      document.getElementById('professorQuote').textContent = c.professor.quote;
      document.getElementById('professorName').textContent = c.professor.name;
      document.getElementById('professorAffiliation').textContent = c.professor.affiliation;
      const profile = c.professorProfile || {};
      document.getElementById('professorProfile').innerHTML = `
        <div><strong>Education</strong>${(profile.education||[]).map(x=>`<span>${esc(x)}</span>`).join('')}</div>
        <div><strong>Experience</strong>${(profile.experience||[]).map(x=>`<span>${esc(x)}</span>`).join('')}</div>`;
      document.getElementById('statsGrid').innerHTML = d.stats.map(x => `<div class="stat"><strong>${esc(x.value)}</strong><span>${esc(x.label)}</span></div>`).join('');
      document.getElementById('recruitmentTitle').textContent = d.recruitmentTitle || '';
      document.getElementById('recruitmentDescription').textContent = d.recruitmentDescription || '';
      document.getElementById('recruitmentContact').textContent = d.recruitmentContact || 'Contact';

      initHeroVideo();
    });
  </script>
</body>
</html>
