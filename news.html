<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Advanced Energy Materials Laboratory"><link rel="stylesheet" href="styles.css"><script src="js/content-common.js"></script><title>AEM Lab</title><script src="js/content-news.js"></script><script src="js/app.js"></script></head><body><header id="siteHeader"></header><main><section class="page-hero" id="pageHero"></section><section class="about"><div class="container"><div class="news-grid" id="newsGrid"></div></div></section></main><footer id="siteFooter"></footer><script>document.addEventListener('DOMContentLoaded',()=>{renderShell('news');renderPageHero();const d=PAGE_CONTENT;const featured=d.news.find(x=>x.featured)||d.news[0];const rest=d.news.filter(x=>x!==featured);document.getElementById('newsGrid').innerHTML=`<div class="card news-feature"><div class="num" style="color:#9dc9f3">${esc(featured?.date||'')}</div><h3 style="font-size:31px;margin-top:90px">${esc(featured?.title||'')}</h3><p>${esc(featured?.description||'')}</p></div><div class="news-small">${rest.map(x=>`<div class="card"><div class="num">${esc(x.date)}</div><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p></div>`).join('')}</div>`;});</script></body></html>
