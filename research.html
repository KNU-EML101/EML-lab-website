<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Advanced Energy Materials Laboratory"><link rel="stylesheet" href="styles.css"><script src="js/content-common.js"></script><title>AEM Lab</title><script src="js/content-research.js"></script><script src="js/app.js"></script></head><body><header id="siteHeader"></header><main><section class="page-hero" id="pageHero"></section><section><div class="container"><div class="grid-3" id="researchGrid"></div></div></section></main><footer id="siteFooter"></footer><script>document.addEventListener('DOMContentLoaded',()=>{renderShell('research');renderPageHero();document.getElementById('researchGrid').innerHTML=PAGE_CONTENT.research.map((x,i)=>`<article class="card research-card"><div class="num">${String(i+1).padStart(2,'0')} / ${esc(x.code)}</div><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p></article>`).join('');});</script></body></html>
