<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Advanced Energy Materials Laboratory"><link rel="stylesheet" href="styles.css"><script src="js/content-common.js"></script><title>AEM Lab</title><script src="js/content-members.js"></script><script src="js/app.js"></script></head><body><header id="siteHeader"></header><main><section class="page-hero" id="pageHero"></section><section class="about"><div class="container"><div class="members" id="membersGrid"></div></div></section></main><footer id="siteFooter"></footer><script>document.addEventListener('DOMContentLoaded',()=>{renderShell('members');renderPageHero();document.getElementById('membersGrid').innerHTML=PAGE_CONTENT.members.map(x=>`<div class="member"><div class="member-photo">${x.photo?`<img src="${esc(x.photo)}" alt="${esc(x.name)}" style="width:100%;height:100%;object-fit:contain;background:#fff;padding:8px">`:''}</div><h4>${esc(x.name)}</h4><p>${esc(x.position)}${x.research?' · '+esc(x.research):''}</p></div>`).join('');});</script></body></html>
