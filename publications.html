<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="description" content="Advanced Energy Materials Laboratory Publications">
  <link rel="stylesheet" href="styles.css">
  <script src="js/content-common.js"></script>
  <title>AEM Lab</title>
  <script src="js/content-publications.js"></script>
  <script src="js/app.js"></script>
</head>
<body>
  <header id="siteHeader"></header>
  <main>
    <section class="page-hero" id="pageHero"></section>
    <section>
      <div class="container">
        <div class="pub-note">
          Journal publications are shown first and grouped by year. Patents, conference abstracts, preprints, errata, duplicate/alternate-language records, and entries requiring manual review are separated below.
        </div>
        <div id="publicationsList"></div>
        <div id="otherPublications"></div>
      </div>
    </section>
  </main>
  <footer id="siteFooter"></footer>

  <script>
    document.addEventListener('DOMContentLoaded',()=>{
      renderShell('publications');
      renderPageHero();

      const pubs = PAGE_CONTENT.publications || [];
      const grouped = pubs.reduce((acc,x)=>{
        const y = x.year || 'Year not listed';
        (acc[y] ||= []).push(x);
        return acc;
      },{});

      const yearKeys = Object.keys(grouped).sort((a,b)=>{
        if(a === 'Year not listed') return 1;
        if(b === 'Year not listed') return -1;
        return Number(b) - Number(a);
      });

      document.getElementById('publicationsList').innerHTML = yearKeys.map(year=>`
        <section class="pub-year-group">
          <h2 class="pub-year-heading">${esc(year)} <span class="pub-count">${grouped[year].length} publication${grouped[year].length>1?'s':''}</span></h2>
          <div class="pubs">
            ${grouped[year].map(x=>`
              <div class="pub">
                <div class="pub-year">${esc(x.year)}</div>
                <div>
                  <div class="pub-title">${x.doi?`<a href="${esc(x.doi)}" target="_blank" rel="noopener">${esc(x.title)}</a>`:esc(x.title)}</div>
                  <div class="pub-meta">${esc(x.authors)} · ${esc(x.journal)}</div>
                </div>
                <div class="tag">${esc(x.type||'Journal')}</div>
              </div>`).join('')}
          </div>
        </section>`).join('');

      const other = PAGE_CONTENT.otherSections || [];
      if(other.length){
        document.getElementById('otherPublications').innerHTML = `
          <div class="pub-other-wrap">
            <div class="pub-other-head">
              <h2>Other Research Outputs</h2>
              <p>Items separated from the main peer-reviewed journal list based on the information contained in the source spreadsheet.</p>
            </div>
            ${other.map(section=>`
              <section class="pub-other-section">
                <h3>${esc(section.title)}</h3>
                <div class="pubs">
                  ${section.items.map(x=>`
                    <div class="pub">
                      <div class="pub-year">${esc(x.year)}</div>
                      <div>
                        <div class="pub-title">${esc(x.title)}</div>
                        <div class="pub-meta">${esc(x.authors)} · ${esc(x.journal)}</div>
                      </div>
                      <div class="tag">${esc(x.type)}</div>
                    </div>`).join('')}
                </div>
              </section>`).join('')}
          </div>`;
      }
    });
  </script>
</body>
</html>
