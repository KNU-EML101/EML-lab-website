<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Advanced Energy Materials Laboratory"><link rel="stylesheet" href="styles.css"><script src="js/content-common.js"></script><title>AEM Lab</title><script src="js/content-publications.js"></script><script src="js/app.js"></script></head><body><header id="siteHeader"></header><main><section class="page-hero" id="pageHero"></section><section><div class="container"><div class="pubs" id="publicationsList"></div></div></section></main><footer id="siteFooter"></footer><script>document.addEventListener('DOMContentLoaded',()=>{renderShell('publications');renderPageHero();document.getElementById('publicationsList').innerHTML=PAGE_CONTENT.publications.map(x=>`<div class="pub"><div class="pub-year">${esc(x.year)}</div><div><div class="pub-title">${x.doi?`<a href="${esc(x.doi)}" target="_blank" rel="noopener">${esc(x.title)}</a>`:esc(x.title)}</div><div class="pub-meta">${esc(x.authors)} · ${esc(x.journal)}</div></div><div class="tag">${esc(x.type||'Article')}</div></div>`).join('');});</script></body></html>
