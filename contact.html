<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Advanced Energy Materials Laboratory"><link rel="stylesheet" href="styles.css"><script src="js/content-common.js"></script><title>AEM Lab</title><script src="js/content-contact.js"></script><script src="js/app.js"></script></head><body><header id="siteHeader"></header><main><section class="page-hero" id="pageHero"></section><section><div class="container"><div class="contact-grid"><div class="card"><div class="eyebrow">Lab Information</div><div id="contactDetails"></div></div><div class="card"><div class="eyebrow">Inquiry</div><h3 style="margin-top:22px">Join & Collaboration</h3><p id="contactExtra"></p></div></div></div></section></main><footer id="siteFooter"></footer><script>document.addEventListener('DOMContentLoaded',()=>{renderShell('contact');renderPageHero();const c=COMMON_CONTENT.contact;document.getElementById('contactDetails').innerHTML=[['Room',c.room],['Address',c.address],['Email',c.email],['Tel',c.tel],['Fax',c.fax]].filter(([,v])=>v).map(([k,v])=>`<div class="contact-line"><strong>${esc(k)}</strong><span class="muted">${esc(v)}</span></div>`).join('');document.getElementById('contactExtra').textContent=PAGE_CONTENT.extra;});</script></body></html>
