<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="description" content="Energy Materials Laboratory Contact">
  <link rel="stylesheet" href="styles.css">
  <script src="js/content-common.js"></script>
  <title>EML Lab</title>
  <script src="js/content-contact.js"></script>
  <script src="js/app.js"></script>
</head>
<body>
  <header id="siteHeader"></header>
  <main>
    <section class="page-hero" id="pageHero"></section>

    <section>
      <div class="container">
        <div class="contact-grid">
          <div class="card">
            <div class="eyebrow">Lab Information</div>
            <div id="contactDetails"></div>
          </div>

          <div class="card">
            <div class="eyebrow">Inquiry</div>
            <h3 style="margin-top:22px">Join & Collaboration</h3>
            <p id="contactExtra"></p>
          </div>
        </div>

        <div class="contact-map-section">
          <div class="section-head contact-map-head">
            <div>
              <div class="eyebrow">Location</div>
              <h2>Engineering Building 1</h2>
            </div>
            <p>Kyungpook National University · Engineering Building 1 (공대1호관)</p>
          </div>

          <div class="map-wrap">
            <iframe
              title="Kyungpook National University Engineering Building 1"
              src="https://www.google.com/maps?q=%EA%B2%BD%EB%B6%81%EB%8C%80%ED%95%99%EA%B5%90+%EA%B3%B5%EB%8C%801%ED%98%B8%EA%B4%80&output=embed"
              loading="lazy"
              allowfullscreen
              referrerpolicy="no-referrer-when-downgrade">
            </iframe>
          </div>

          <a class="map-link" href="https://www.google.com/maps/search/?api=1&query=%EA%B2%BD%EB%B6%81%EB%8C%80%ED%95%99%EA%B5%90+%EA%B3%B5%EB%8C%801%ED%98%B8%EA%B4%80" target="_blank" rel="noopener">Open in Google Maps ↗</a>
        </div>
      </div>
    </section>
  </main>

  <footer id="siteFooter"></footer>

  <script>
    document.addEventListener('DOMContentLoaded',()=>{
      renderShell('contact');
      renderPageHero();
      const c=COMMON_CONTENT.contact;
      document.getElementById('contactDetails').innerHTML=[
        ['Room',c.room],
        ['Address',c.address],
        ['Email',c.email],
        ['Tel',c.tel],
        ['Fax',c.fax]
      ].filter(([,v])=>v).map(([k,v])=>`<div class="contact-line"><strong>${esc(k)}</strong><span class="muted">${esc(v)}</span></div>`).join('');
      document.getElementById('contactExtra').textContent=PAGE_CONTENT.extra;
    });
  </script>
</body>
</html>
